name: Pocketwise quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm run types:database:check
      - run: npm test
      - run: npm run test:database
      - run: npm run test:legacy
      - run: npx expo-doctor
      - run: npm run export:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            test-results/
            playwright-report/
  calendar-zones:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zone: [UTC, Europe/Berlin, America/Los_Angeles, Pacific/Kiritimati]
    env:
      TZ: ${{ matrix.zone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - run: npm run test:timezones -- --zone "${{ matrix.zone }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timezone-results-${{ strategy.job-index }}
          path: test-results/timezones/
